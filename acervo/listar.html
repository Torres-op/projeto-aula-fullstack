<form method="GET">

    <div>
        <label for="nome">Nome do livro:</label>

        <input
            type="text"
            id="nome"
            name="nome"
            placeholder="Digite o nome do livro"
            value="{{ nome }}"
        >
    </div>

    <div>
        <label for="tipo">Tipo:</label>

        <select name="tipo" id="tipo">
            <option value="">Todos</option>

            {% for valor, label in tipos %}
                <option
                    value="{{ valor }}"
                    {% if tipo_selecionado == valor %}selected{% endif %}
                >
                    {{ label }}
                </option>
            {% endfor %}
        </select>
    </div>

    <div>
        <label for="categoria">Categoria:</label>

        <select name="categoria" id="categoria">
            <option value="">Todas</option>

            {% for valor, label in categorias %}
                <option
                    value="{{ valor }}"
                    {% if categoria_selecionada == valor|stringformat:"s" %}selected{% endif %}
                >
                    {{ label }}
                </option>
            {% endfor %}
        </select>
    </div>

    <button type="submit">
        Pesquisar
    </button>

    <a href="{% url 'listar_acervo' %}">
        Limpar filtros
    </a>

</form>
